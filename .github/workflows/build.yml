name: Build

# Every push and pull request: build the plugins on macOS (universal), Windows (x64) and Linux (x64),
# run the tests, and keep the zips, tarballs and installers as artifacts. Pushing a tag like v2.0.0
# also publishes them as a GitHub Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  SNAPTUNE_NO_TELEMETRY: 1   # loading the plugin in CI must not count as a session (Source/Telemetry.h)

defaults:
  run:
    shell: bash   # explicit bash enables -o pipefail, so a failing command in a pipe fails the step

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.version.outputs.number }}
      name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version
        id: version
        run: |
          project_version=$(sed -nE 's/^project\(SnapTune VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          echo "number=$project_version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "${GITHUB_REF_NAME#v}" != "$project_version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match project(VERSION $project_version) in CMakeLists.txt"
              exit 1
            fi
            echo "name=$project_version" >> "$GITHUB_OUTPUT"
          else
            echo "name=$project_version-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  macos:
    needs: version
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Configure (downloads JUCE)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3, AU and Standalone (universal)
        run: cmake --build build --target SnapTune_VST3 SnapTune_AU SnapTune_Standalone

      - name: Build tests
        run: cmake --build build --target SnapTuneTests

      - name: DSP tests
        run: ./build/SnapTuneTests_artefacts/Release/SnapTuneTests

      - name: Load the built VST3 in a host
        run: ./build/SnapTuneTests_artefacts/Release/SnapTuneTests --host build/SnapTune_artefacts/Release/VST3/SnapTune.vst3

      - name: Apple AU validation
        run: |
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aumf Snpt Ncfz | tail -n 5

      - name: Package
        run: |
          artefacts=build/SnapTune_artefacts/Release
          name=SnapTune-${{ needs.version.outputs.name }}
          stage=dist/stage/$name
          mkdir -p "$stage"
          ditto "$artefacts/VST3/SnapTune.vst3" "$stage/SnapTune.vst3"
          ditto "$artefacts/AU/SnapTune.component" "$stage/SnapTune.component"
          ditto "$artefacts/Standalone/SnapTune.app" "$stage/SnapTune.app"
          cp packaging/macos/INSTALL.txt LICENSE "$stage/"

          # Seal each bundle with an ad-hoc signature (the app only has a linker signature on its
          # binary otherwise, which macOS reports as damaged after download).
          for bundle in "$stage"/*.vst3 "$stage"/*.component "$stage"/*.app; do
            codesign --force --deep --sign - "$bundle"
            codesign --verify --deep --strict "$bundle"
            lipo -info "$bundle"/Contents/MacOS/*
          done

          ditto -c -k --keepParent "$stage" "dist/$name-macOS.zip"
          packaging/macos/build-pkg.sh "$stage" "${{ needs.version.outputs.number }}" "dist/$name-macOS.pkg"

      - uses: actions/upload-artifact@v7
        with:
          name: SnapTune-${{ needs.version.outputs.name }}-macOS
          path: |
            dist/*.zip
            dist/*.pkg

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Configure (downloads JUCE)
        run: cmake -B build -A x64

      - name: Build VST3 and Standalone
        run: cmake --build build --config Release --parallel --target SnapTune_VST3 SnapTune_Standalone

      - name: Build tests
        run: cmake --build build --config Release --parallel --target SnapTuneTests

      - name: DSP tests
        run: ./build/SnapTuneTests_artefacts/Release/SnapTuneTests.exe

      - name: Load the built VST3 in a host
        # juce::File needs an absolute path on Windows.
        run: ./build/SnapTuneTests_artefacts/Release/SnapTuneTests.exe --host "$(cygpath -m "$PWD/build/SnapTune_artefacts/Release/VST3/SnapTune.vst3")"

      - name: Package zip
        run: |
          artefacts=build/SnapTune_artefacts/Release
          name=SnapTune-${{ needs.version.outputs.name }}
          stage=dist/stage/$name-Windows
          mkdir -p "$stage"
          cp -R "$artefacts/VST3/SnapTune.vst3" "$stage/"
          cp "$artefacts/Standalone/SnapTune.exe" "$stage/"
          cp packaging/windows/INSTALL.txt "$stage/"
          cp LICENSE "$stage/LICENSE.txt"
          (cd dist/stage && 7z a -tzip "../$name-Windows.zip" "$name-Windows" > /dev/null)

      - name: Package installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { Write-Error "ISCC.exe not found"; exit 1 }
          & $iscc.FullName `
            "/DAppVersion=${{ needs.version.outputs.name }}" `
            "/DAppNumber=${{ needs.version.outputs.number }}" `
            "/DStageDir=$PWD\dist\stage\SnapTune-${{ needs.version.outputs.name }}-Windows" `
            "/O$PWD\dist" `
            packaging\windows\SnapTune.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: SnapTune-${{ needs.version.outputs.name }}-Windows
          path: |
            dist/*.zip
            dist/*.exe

  linux:
    needs: version
    # The oldest Ubuntu the runners offer, so the build runs on any distribution with its glibc (2.35)
    # or newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build xvfb openbox \
            libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev

      - name: Configure (downloads JUCE)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3, LV2 and Standalone
        run: cmake --build build --target SnapTune_VST3 SnapTune_LV2 SnapTune_Standalone

      - name: Check the run-time dependencies
        # libcurl, for the usage ping, is opened at run time when the system has it; the plugin must
        # still load where it doesn't.
        run: |
          artefacts=build/SnapTune_artefacts/Release
          for binary in "$artefacts"/VST3/SnapTune.vst3/Contents/x86_64-linux/SnapTune.so "$artefacts"/LV2/SnapTune.lv2/*.so "$artefacts"/Standalone/SnapTune; do
            echo "$binary"
            readelf -d "$binary" | grep NEEDED
            if readelf -d "$binary" | grep -q -e libcurl -e libstdc++; then
              echo "::error::$binary must not depend on libcurl or libstdc++"
              exit 1
            fi
          done

      - name: Build tests
        run: cmake --build build --target SnapTuneTests

      - name: DSP tests
        run: xvfb-run -a ./build/SnapTuneTests_artefacts/Release/SnapTuneTests

      - name: Load the built VST3 and LV2 in a host
        # In a virtual display with a window manager, as on a desktop: the editor's window uses X11
        # atoms that only exist once a window manager has registered them.
        run: |
          # The build also copied the LV2 to ~/.lv2; LV2 hosts read that folder first and would ignore
          # the bundle under test as a duplicate.
          rm -rf "$HOME/.lv2/SnapTune.lv2"
          xvfb-run -a sh -c '
            openbox & sleep 2
            tests=./build/SnapTuneTests_artefacts/Release/SnapTuneTests
            "$tests" --host "$PWD/build/SnapTune_artefacts/Release/VST3/SnapTune.vst3" &&
            "$tests" --host "$PWD/build/SnapTune_artefacts/Release/LV2/SnapTune.lv2"'

      - name: Package
        run: |
          artefacts=build/SnapTune_artefacts/Release
          name=SnapTune-${{ needs.version.outputs.name }}-Linux
          stage=dist/stage/$name
          mkdir -p "$stage"
          cp -R "$artefacts/VST3/SnapTune.vst3" "$artefacts/LV2/SnapTune.lv2" "$stage/"
          cp "$artefacts/Standalone/SnapTune" "$stage/"
          cp packaging/linux/install.sh packaging/linux/INSTALL.txt packaging/linux/snaptune.png LICENSE "$stage/"
          chmod +x "$stage/install.sh" "$stage/SnapTune"
          tar -C dist/stage -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: SnapTune-${{ needs.version.outputs.name }}-Linux
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "SnapTune ${{ needs.version.outputs.name }}" \
            --notes-file packaging/release-notes.md \
            --verify-tag

      - name: Check the release has every installer
        # The website's buttons find the installers by these endings (website/lib/release.ts).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name')
          echo "$assets"
          for ending in -macOS.pkg -Windows-Setup.exe -Linux.tar.gz; do
            if ! grep -q -- "$ending\$" <<< "$assets"; then
              echo "::error::The release has no file ending in $ending"
              exit 1
            fi
          done
